
name: MLOps Pipeline

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  schedule:
    - cron: '0 0 * * 0'

  workflow_dispatch:
    inputs:
      run_all:
        description: 'Run all jobs'
        required: false
        default: false
        type: boolean

      run_data_processing:
        description: 'Run data processing job'
        required: false
        default: false
        type: boolean

      run_model_training:
        description: 'Run model training job'
        required: false
        default: true
        type: boolean

      run_build_and_publish:
        description: 'Run build and publish job'
        required: false
        default: true
        type: boolean

  release:
    types: [created]

permissions:
  contents: read
  packages: write

env:
  PYTHON_VERSION: '3.11'
  DOCKER_USERNAME: YOUR_DOCKER_USERNAME
  IMAGE_NAME: house-price-model

jobs:

  # =========================================
  # JOB 1: DATA PROCESSING
  # =========================================

  data-processing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Process data
        run: |
          python src/data/run_processing.py \
            --input data/raw/house_data.csv \
            --output data/processed/cleaned_house_data.csv

      - name: Engineer features
        run: |
          python src/features/engineer.py \
            --input data/processed/cleaned_house_data.csv \
            --output data/processed/featured_house_data.csv \
            --preprocessor models/trained/preprocessor.pkl

      - name: Upload processed data
        uses: actions/upload-artifact@v4
        with:
          name: processed-data
          path: data/processed/featured_house_data.csv

      - name: Upload preprocessor
        uses: actions/upload-artifact@v4
        with:
          name: preprocessor
          path: models/trained/preprocessor.pkl


  # =========================================
  # JOB 2: MODEL TRAINING
  # =========================================

  model-training:
    needs: data-processing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Download processed data
        uses: actions/download-artifact@v4
        with:
          name: processed-data
          path: data/processed/

      - name: Set up MLflow
        run: |
          docker pull ghcr.io/mlflow/mlflow:latest

          docker run -d \
            -p 5000:5000 \
            --name mlflow-server \
            ghcr.io/mlflow/mlflow:latest \
            mlflow server \
            --host 0.0.0.0 \
            --backend-store-uri sqlite:///mlflow.db

      - name: Wait for MLflow to start
        run: |
          for i in {1..20}; do
            if curl -fsS http://localhost:5000/health; then
              echo "MLflow server is ready"
              exit 0
            fi

            sleep 5
          done

          echo "MLflow server failed to start"
          docker logs mlflow-server
          exit 1

      - name: Train model
        run: |
          mkdir -p models

          python src/models/train_model.py \
            --config configs/model_config.yaml \
            --data data/processed/featured_house_data.csv \
            --models-dir models \
            --mlflow-tracking-uri http://localhost:5000

      - name: Upload trained model
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: models/

      - name: Clean up MLflow
        if: always()
        run: |
          docker stop mlflow-server || true
          docker rm mlflow-server || true


  # =========================================
  # JOB 3: BUILD AND PUBLISH DOCKER IMAGE
  # =========================================

  build-and-publish:
    needs: model-training
    runs-on: ubuntu-latest

    if: |
      github.event_name == 'push' ||
      github.event_name == 'release' ||
      (
        github.event_name == 'workflow_dispatch' &&
        (
          inputs.run_all ||
          inputs.run_build_and_publish
        )
      )

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download trained model
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: models/

      - name: Download preprocessor
        uses: actions/download-artifact@v4
        with:
          name: preprocessor
          path: models/trained/

      - name: Verify repository structure
        run: |
          echo "Current directory:"
          pwd

          echo "API directory:"
          ls -la src/api/

          echo "Finding Dockerfile:"
          find . -type f -iname 'Dockerfile'

          test -f src/api/Dockerfile || {
            echo "ERROR: src/api/Dockerfile not found"
            exit 1
          }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          COMMIT_HASH=$(echo "${{ github.sha }}" | cut -c1-7)

          IMAGE=ghcr.io/${DOCKER_USERNAME}/${IMAGE_NAME}

          echo "Building Docker image: $IMAGE:$COMMIT_HASH"

          docker build \
            -t $IMAGE:$COMMIT_HASH \
            -f src/api/Dockerfile \
            .

      - name: Run Docker container
        run: |
          COMMIT_HASH=$(echo "${{ github.sha }}" | cut -c1-7)

          IMAGE=ghcr.io/${DOCKER_USERNAME}/${IMAGE_NAME}

          docker run -d \
            -p 8000:8000 \
            --name test-api \
            $IMAGE:$COMMIT_HASH

      - name: Check API health
        run: |
          for i in {1..10}; do

            if curl -fsS http://localhost:8000/health; then
              echo "API is healthy"
              exit 0
            fi

            echo "Waiting for API..."
            sleep 5
          done

          echo "API health check failed"

          docker logs test-api
          exit 1

      - name: Check container logs
        if: always()
        run: |
          docker logs test-api || true

      - name: Clean up Test Container
        if: always()
        run: |
          docker stop test-api || true
          docker rm test-api || true

      # -------------------------------------
      # GHCR LOGIN
      # -------------------------------------

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------------------
      # PUSH DOCKER IMAGE
      # -------------------------------------

      - name: Push Docker image to GHCR
        run: |
          COMMIT_HASH=$(echo "${{ github.sha }}" | cut -c1-7)

          IMAGE=ghcr.io/${DOCKER_USERNAME}/${IMAGE_NAME}

          echo "Pushing Docker image: $IMAGE"

          docker tag \
            $IMAGE:$COMMIT_HASH \
            $IMAGE:latest

          docker push $IMAGE:$COMMIT_HASH

          docker push $IMAGE:latest
