# .github/workflows/mlops-pipeline.yml
name: MLOps Pipeline

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0' # Weekly, Sundays 00:00 UTC
  workflow_dispatch:
    inputs:
      run_all:
        description: 'Run all jobs'
        required: false
        type: boolean
        default: false
      run_data_processing:
        description: 'Run data processing job'
        required: false
        type: boolean
        default: false
      run_model_training:
        description: 'Run model training job'
        required: false
        type: boolean
        default: true
      run_build_and_publish:
        description: 'Run build and publish job'
        required: false
        type: boolean
        default: true
  release:
    types: [created]

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'

jobs:
  data-processing:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.run_all || inputs.run_data_processing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Process data
        run: |
          python src/data/run_processing.py \
            --input data/raw/house_data.csv \
            --output data/processed/cleaned_house_data.csv

      - name: Engineer features
        run: |
          python src/features/engineer.py \
            --input data/processed/cleaned_house_data.csv \
            --output data/processed/featured_house_data.csv \
            --preprocessor models/trained/preprocessor.pkl

      - name: Upload processed data
        uses: actions/upload-artifact@v4
        with:
          name: processed-data
          path: data/processed/featured_house_data.csv

      - name: Upload preprocessor
        uses: actions/upload-artifact@v4
        with:
          name: preprocessor
          path: models/trained/preprocessor.pkl

  model-training:
    needs: data-processing
    runs-on: ubuntu-latest
    if: >-
      always() &&
      needs.data-processing.result != 'failure' &&
      needs.data-processing.result != 'cancelled' &&
      (github.event_name != 'workflow_dispatch' ||
       inputs.run_all || inputs.run_model_training)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Download processed data
        uses: actions/download-artifact@v4
        with:
          name: processed-data
          path: data/processed/

      - name: Start MLflow server
        run: |
          docker pull ghcr.io/mlflow/mlflow:latest
          docker run -d -p 5000:5000 --name mlflow-server \
            ghcr.io/mlflow/mlflow:latest \
            mlflow server --host 0.0.0.0 --backend-store-uri sqlite:///mlflow.db

      - name: Wait for MLflow to start
        run: |
          for i in $(seq 1 10); do
            if curl -fs http://localhost:5000/health; then
              echo "MLflow is up"
              exit 0
            fi
            sleep 5
          done
          echo "MLflow failed to start"
          docker logs mlflow-server
          exit 1

      - name: Train model
        run: |
          mkdir -p models
          python src/models/train_model.py \
            --config configs/model_config.yaml \
            --data data/processed/featured_house_data.csv \
            --models-dir models \
            --mlflow-tracking-uri http://localhost:5000

      - name: Upload trained model
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: models/

      - name: Clean up MLflow
        if: always()
        run: |
          docker stop mlflow-server || true
          docker rm mlflow-server || true

  build-and-publish:
    needs: model-training
    runs-on: ubuntu-latest
    if: >-
      always() &&
      needs.model-training.result == 'success' &&
      (github.event_name != 'workflow_dispatch' ||
       inputs.run_all || inputs.run_build_and_publish)
    permissions:
      contents: read
      packages: write # Required to push to GHCR with GITHUB_TOKEN

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download trained model
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: models/

      - name: Download preprocessor
        uses: actions/download-artifact@v4
        with:
          name: preprocessor
          path: models/trained/

      - name: Set image name
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          COMMIT_HASH=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "IMAGE=ghcr.io/${OWNER}/house-price-model" >> "$GITHUB_ENV"
          echo "TAG=${COMMIT_HASH}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: |
          test -f src/api/Dockerfile
          docker build -t "$IMAGE:$TAG" -f src/api/Dockerfile .

      - name: Test image
        run: |
          docker run -d -p 8000:8000 --name test-api "$IMAGE:$TAG"

          for i in $(seq 1 10); do
            if curl -fs http://localhost:8000/health; then
              echo "API is healthy"
              break
            fi
            if [ "$i" -eq 10 ]; then
              echo "API health check failed"
              docker logs test-api
              exit 1
            fi
            sleep 5
          done

      - name: Clean up test container
        if: always()
        run: |
          docker stop test-api || true
          docker rm test-api || true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: |
          docker push "$IMAGE:$TAG"

          # Also tag and push as latest
          docker tag "$IMAGE:$TAG" "$IMAGE:latest"
          docker push "$IMAGE:latest"