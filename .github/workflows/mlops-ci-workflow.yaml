name: MLOps CI Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r house-price-predictor/requirements.txt
          pip install pytest

      - name: Collect tests (debug)
        run: |
          python -m pytest house-price-predictor/tests/ --collect-only -q
        continue-on-error: true

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python --version
          python -m pytest --version
          python -m pytest house-price-predictor/tests/ -v -s
        continue-on-error: true